<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: rgba(240,246,252,.1);
    --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 300px; background: var(--bg); color: var(--text);
         font: 12px/1.45 'Segoe UI', system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
           border-bottom: 1px solid var(--border); }
  header img { width: 18px; height: 18px; }
  header .name { font-weight: 600; font-size: 12.5px; flex: 1; }
  header .ver { color: var(--muted); font-size: 10px; }
  section { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  section:last-child { border-bottom: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); } .small { font-size: 10.5px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: #30363d;
    border-radius: 10px; transition: background .15s; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #c9d1d9; transition: transform .15s; }
  .switch input:checked + .track { background: var(--green); }
  .switch input:checked + .track .knob { transform: translateX(16px); background: #fff; }
  .switch input:disabled + .track { opacity: .4; }
  button { width: 100%; padding: 9px 0; border: 1px solid transparent;
    border-radius: 6px; color: #fff;
    font: 600 12px 'Segoe UI', system-ui, sans-serif; cursor: pointer; }
  button.start { background: #238636; border-color: #2ea043; }
  button.start:hover { background: #2ea043; }
  button.stop { background: #b62324; border-color: #f85149; }
  button.stop:hover { background: #da3633; }
  button:disabled { background: #21262d; border-color: var(--border);
    color: var(--muted); cursor: default; }
  .note { margin-top: 6px; min-height: 13px; }
  .stat { display: flex; justify-content: space-between; padding: 2px 0; }
  .stat .k { color: var(--muted); }
  .stat .v { font-family: Consolas, monospace; font-size: 11px; }
  .err { color: #ff9d97; font-size: 10.5px; word-break: break-all; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <span class="name">Network-path Bridge</span>
    <span class="ver">1.3</span>
  </header>

  <section>
    <button id="btnCapture" class="start">Start capture on this tab</button>
    <div class="muted small note ellipsis" id="txtState"></div>
  </section>

  <section>
    <div class="stat"><span class="k">Requests sent</span><span class="v" id="stSent">0</span></div>
    <div class="stat"><span class="k">Dropped</span><span class="v" id="stDropped">0</span></div>
    <div class="err" id="stError" style="margin-top:6px;"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
