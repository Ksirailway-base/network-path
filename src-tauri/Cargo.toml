[package]
name = "app"
version = "0.1.0"
description = "Browser traffic inspector built with Tauri and Rust"
authors = ["Ksirailway-base"]
license = "MIT"
repository = "https://github.com/Ksirailway-base/network-path"
edition = "2021"
rust-version = "1.77.2"


[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
tungstenite = "0.26"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
